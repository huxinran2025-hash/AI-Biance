steps:
  # Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['install']
    dir: 'cloud-backend'
  
  # Build TypeScript
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    dir: 'cloud-backend'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-east1-docker.pkg.dev/biance-476510/biance-repo/backend:$SHORT_SHA'
      - '-t'
      - 'asia-east1-docker.pkg.dev/biance-476510/biance-repo/backend:latest'
      - '.'
    dir: 'cloud-backend'
  
  # Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-east1-docker.pkg.dev/biance-476510/biance-repo/backend:$SHORT_SHA'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-east1-docker.pkg.dev/biance-476510/biance-repo/backend:latest'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'biance-backend'
      - '--image'
      - 'asia-east1-docker.pkg.dev/biance-476510/biance-repo/backend:latest'
      - '--region'
      - 'asia-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'biance-ai@biance-476510.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=biance-476510'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--concurrency'
      - '100'
  
  # Wait for deployment to be ready
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "Waiting for service to be ready..."
        sleep 30
        
        # Get service URL
        SERVICE_URL=$$(gcloud run services describe biance-backend --region=asia-east1 --format="value(status.url)")
        echo "Service URL: $$SERVICE_URL"
        
        # Test health endpoint
        for i in {1..5}; do
          if curl -f -s "$$SERVICE_URL/health" > /dev/null; then
            echo "Health check passed"
            break
          else
            echo "Health check failed, retrying in 10s..."
            sleep 10
          fi
        done
  
  # Run acceptance tests
  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        cd cloud-backend
        SERVICE_URL=$$(gcloud run services describe biance-backend --region=asia-east1 --format="value(status.url)")
        export BACKEND_URL=$$SERVICE_URL
        echo "Running acceptance tests against: $$SERVICE_URL"
        node acceptance-test.js

images:
  - 'asia-east1-docker.pkg.dev/biance-476510/biance-repo/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

